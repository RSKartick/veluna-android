name: Veluna CI & Release APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Verify Rules, Unit Tests & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: "20"

      - name: Set up JDK 21
        uses: actions/setup-java@6a0805fcefea3d4657a47ac4c165951e33482018 # v4.2.2
        with:
          distribution: temurin
          java-version: "21"

      - name: Ensure Android SDK licenses are accepted
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -n "$SDK_ROOT" ] && [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Validate Gradle Wrapper & Setup Gradle
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2

      - name: Install Node test dependencies
        run: npm ci

      - name: Materialize local emulator google-services.json for CI tests
        run: |
          if [ ! -f app/google-services.json ]; then
            cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "100000000000",
              "project_id": "veluna-ci-test",
              "storage_bucket": "veluna-ci-test.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:100000000000:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "com.veluna.music"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "100000000000-ci000000000000000000000000000000.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "veluna-ci-emulator-only-key"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Run Firestore security rules, unit tests, lint, and compile check
        run: |
          npx firebase emulators:exec --only firestore,auth --project veluna-ci-test \
            "FIRESTORE_EMULATOR_HOST=127.0.0.1:8085 FIREBASE_AUTH_EMULATOR_HOST=127.0.0.1:9099 node --test firestore.test.js && chmod +x ./gradlew && ./gradlew :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin :app:lintDebug :app:compileReleaseKotlin --no-daemon --stacktrace"

      - name: Upload test and lint reports on failure
        if: failure()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: ci-test-lint-reports
          path: app/build/reports/
          if-no-files-found: ignore
          retention-days: 7

  instrumentation-test:
    name: Android Keystore Instrumentation Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@6a0805fcefea3d4657a47ac4c165951e33482018 # v4.2.2
        with:
          distribution: temurin
          java-version: "21"

      - name: Ensure Android SDK licenses are accepted
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -n "$SDK_ROOT" ] && [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Validate Gradle Wrapper & Setup Gradle
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2

      - name: Enable KVM for Android Emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Materialize local emulator google-services.json for instrumentation build
        run: |
          if [ ! -f app/google-services.json ]; then
            cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "100000000000",
              "project_id": "veluna-ci-test",
              "storage_bucket": "veluna-ci-test.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:100000000000:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "com.veluna.music"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "100000000000-ci000000000000000000000000000000.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "veluna-ci-emulator-only-key"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Run instrumentation tests on Android Emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: chmod +x ./gradlew && ./gradlew :app:connectedDebugAndroidTest --no-daemon --stacktrace

      - name: Upload instrumentation reports on failure
        if: failure()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: ci-instrumentation-reports
          path: app/build/reports/androidTests/
          if-no-files-found: ignore
          retention-days: 7

  build-release:
    name: Build & Publish Signed Release APK
    needs: [test, instrumentation-test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release tag is on main or master
        run: |
          git branch -r --contains "$GITHUB_SHA" | grep -Eq 'origin/(main|master)$' \
            || { echo "Release tags must point to a commit on main or master"; exit 1; }

      - name: Require release secrets
        env:
          KS_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.RELEASE_KEY_PASSWORD }}
          GS_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          EXPECTED_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}
        run: |
          [ -n "$KS_B64" ] || { echo "Missing ANDROID_RELEASE_KEYSTORE_BASE64 secret"; exit 1; }
          [ -n "$KS_PASS" ] || { echo "Missing RELEASE_KEYSTORE_PASSWORD secret"; exit 1; }
          [ -n "$KEY_ALIAS" ] || { echo "Missing RELEASE_KEY_ALIAS secret"; exit 1; }
          [ -n "$KEY_PASS" ] || { echo "Missing RELEASE_KEY_PASSWORD secret"; exit 1; }
          [ -n "$GS_JSON" ] || { echo "Missing GOOGLE_SERVICES_JSON secret"; exit 1; }
          [ -n "$EXPECTED_SHA256" ] || { echo "Missing RELEASE_CERT_SHA256 repository variable"; exit 1; }

      - name: Materialize release signing & Firebase config
        env:
          KS_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          GS_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          printf '%s' "$KS_B64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/release.jks"
          printf '%s\n' "$GS_JSON" > app/google-services.json
          [ -s "$RUNNER_TEMP/release.jks" ] || { echo "Failed to decode release keystore"; exit 1; }
          [ -s app/google-services.json ] || { echo "Failed to write google-services.json"; exit 1; }

      - name: Set up JDK 21
        uses: actions/setup-java@6a0805fcefea3d4657a47ac4c165951e33482018 # v4.2.2
        with:
          distribution: temurin
          java-version: "21"

      - name: Ensure Android SDK licenses are accepted
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -n "$SDK_ROOT" ] && [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Validate Gradle Wrapper & Setup Gradle
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2

      - name: Assemble release APK
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          VER_CODE=$((100 + GITHUB_RUN_NUMBER))
          VER_NAME="${GITHUB_REF_NAME#v}"
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace \
            -PvelunaVersionCode="${VER_CODE}" \
            -PvelunaVersionName="${VER_NAME}"

      - name: Verify release APK signature & non-debuggable manifest
        env:
          EXPECTED_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}
        run: |
          mkdir -p dist
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          [ -n "$APK_PATH" ] && [ -s "$APK_PATH" ] || { echo "Release APK not found"; exit 1; }
          cp "$APK_PATH" dist/veluna-android.apk
          AAPT2=$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" -name aapt2 | sort -V | tail -n 1)
          [ -n "$AAPT2" ] || { echo "aapt2 not found"; exit 1; }
          if "$AAPT2" dump badging dist/veluna-android.apk | grep -q "application-debuggable"; then
            echo "Refusing to publish a debuggable APK"
            exit 1
          fi
          APKSIGNER=$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" -name apksigner | sort -V | tail -n 1)
          [ -n "$APKSIGNER" ] || { echo "apksigner not found"; exit 1; }
          EXPECTED_NORM=$(printf '%s' "$EXPECTED_SHA256" | tr -d ':' | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')
          ACTUAL_CERT_INFO=$("$APKSIGNER" verify --print-certs dist/veluna-android.apk | tee /dev/stderr)
          ACTUAL_NORM=$(printf '%s\n' "$ACTUAL_CERT_INFO" | tr -d ':' | tr '[:upper:]' '[:lower:]')
          printf '%s\n' "$ACTUAL_NORM" | grep -q "$EXPECTED_NORM" \
            || { echo "APK certificate SHA-256 mismatch"; exit 1; }

      - name: Upload release APK artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: veluna-android-release-apk
          path: dist/veluna-android.apk
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.ref_name }}
          name: Veluna ${{ github.ref_name }}
          body: |
            Signed release APK for **Veluna** (Android 8.0+ / API 26+).

            ### Verify Integrity
            Verify the APK signing certificate SHA-256 before installing:
            `apksigner verify --print-certs veluna-android.apk`
          files: dist/veluna-android.apk
          draft: false
          prerelease: false
          generate_release_notes: true
